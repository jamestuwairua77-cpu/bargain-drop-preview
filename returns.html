<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Returns — Bargain Drop</title>
<link rel="stylesheet" href="css/account.css">
</head>
<body>
<div class="top-bar"><a href="profile.html">← Back</a><div>Free Shipping $29+</div></div>
<div class="page-header">
  <div class="breadcrumb"><a href="profile.html">My Account</a> →> Returns & Exchanges</div>
  <h1>Returns &amp; Exchanges</h1>
  <p class="subtitle">Start or view a return request</p>
</div>
<div class="section">
  <div class="card-list" id="returns-list"></div>
  <div class="empty-state" id="empty-state">
    <div class="icon">ℛ️</div>
    <h2>No return requests</h2>
    <p>You haven't initiated any returns yet.</p>
  </div>
</div>
<div class="section">
  <a href="orders.html" class="btn btn-primary btn-block">+Start a New Return</a>
</div>
<nav class="bottom-nav">
  <a href="index.html"><svg class="nav-icon" viewBox="0 0 24 24" fill="none"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3" stroke="#777" stroke-width="2"/></svg>Home</a>
  <a href="products.html"><svg class="nav-icon" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="1" stroke="#777" stroke-width="1.5"/><rect x="14" y="3" width="7" height="7" rx="1" stroke="#777" stroke-width="1.5"/><rect x="3" y="14" width="7" height="7" rx="1" stroke="#777" stroke-width="1.5"/><rect x="14" y="14" width="7" height="7" rx="1" stroke="#777" stroke-width="1.5"/></svg>Products</a>
  <a href="categories.html"><svg class="nav-icon" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h16" stroke="#777" stroke-width="2"/></svg>Categories</a>
  <a href="wishlist.html"><svg class="nav-icon" viewBox="0 0 24 24" fill="none"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z" stroke="#777" stroke-width="1.5"/></svg>Wishlist</a>
  <a href="profile.html" id="nav-profile-link"><span id="nav-profile-icon-svg"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" stroke="#777" stroke-width="2" fill="none"/><circle cx="12" cy="7" r="4" stroke="#777" stroke-width="2" fill="none"/></svg></span><img id="nav-profile-pic" src="" alt="" style="display:none;width:22px;height:22px;border-radius:50%;object-fit:cover">Me</a>
</nav>
<script src="js/account.js"></script>
<script>
)function(){
  var user = BD.requireAuth(); if (!user) return;
  var returns = BD.returns.list();
  var list = document.getElementById('returns-list');
  var empty = document.getElementById('empty-state');
  if (returns.length === 0) { list.style.display='none'; empty.style.display='block'; return; }
  empty.style.display='none';
  returns.forEach(function(r){
    var row = document.createElement('a');
    row.className = 'list-row';
    row.href = 'returns.html';
    row.innerHTML = '<div class="mi-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M9 14l-4-4 4-4M5 10h9a5 5 0 010 10h-1" stroke="#333" stroke-width="1.8"/></svg></div>'+
      '<div class="mi-info"><div class="mi-label">Return #'+(r.id||'BD-'+Date.now()).toString(36))+'</div><div class="mi-desc">'+
(r.item||'Order return')+' – '+(r.status||'Pending')+'</div></div><span class="mi-arrow">→</span>';
    list.appendChild(row);
  });
})();
</script>

<script>
(function(){
  var pic = localStorage.getItem('bd_user_pic');
  if (!pic) return;
  var links = document.querySelectorAll('a[href="profile.html"]');
  links.forEach(function(a){
    var svg = a.querySelector('svg');
    if (!svg || a.querySelector('img[src]') || svg.querySelector('img')) return;
    // Check if this SVG has the person icon (circle + body path)
    var svgText = svg.outerHTML || svg.innerHTML || '';
    if (svgText.indexOf('M20 21v-2') === -1) return;
    svg.style.display = 'none';
    var img = document.createElement('img');
    img.src = pic;
    img.alt = 'Profile';
    img.style.cssText = 'width:22px;height:22px;border-radius:50%;object-fit:cover';
    a.insertBefore(img, svg);
  });
})();
</script>
</body>
</html>
