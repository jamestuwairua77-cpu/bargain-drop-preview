<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>Products — Bargain Drop</title>
<style>:root{--bg:#fafaf8;--fg:#1A1A1A;--muted:#6B6B6B;--meta:#9B9B9B;--line:#F0F0F0;--line2:#f5f5f5;--lilac:#B8A9E8;--amber:#F5A623;--teal:#4ECDC4;--coral:#FF6B6B;--green:#4ADE80;--radius:16px;--pill:9999px}*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg);padding-bottom:100px;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}img{display:block;max-width:100%}button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.top-bar{display:flex;align-items:center;padding:12px 16px;background:#fff;position:sticky;top:0;z-index:100;border-bottom:1px solid var(--line);gap:14px}
.top-bar a.back{font-size:.82rem;font-weight:700;color:var(--fg);display:flex;align-items:center;gap:4px}
.top-bar span#cat-name{font-size:.82rem;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.page-header{padding:20px 16px 4px}
.page-header h1{font-size:1.15rem;font-weight:800;letter-spacing:-.01em;color:var(--fg)}
.page-header p{font-size:.7rem;color:var(--meta);margin-top:4px}
.subcat-bar{display:flex;overflow-x:auto;gap:8px;padding:10px 16px;scrollbar-width:none}
.subcat-bar::-webkit-scrollbar{display:none}
.subcat-chip{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0;border:none;border-radius:var(--radius);background:none;font-size:.65rem;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;transition:all .15s;width:72px}
.subcat-chip:hover{color:var(--fg)}
.subcat-chip.active{color:var(--fg)}
.subcat-chip-img{width:56px;height:56px;border-radius:50%;object-fit:cover;background:var(--line2);border:2px solid transparent;transition:all .15s}
.subcat-chip.active .subcat-chip-img,.subcat-chip:hover .subcat-chip-img{border-color:var(--lilac);transform:scale(1.05)}
.subcat-chip-placeholder{width:56px;height:56px;border-radius:50%;background:var(--line2);display:flex;align-items:center;justify-content:center;font-size:1.2rem;opacity:.4}
.subcat-chip-label{font-size:.62rem;text-align:center;line-height:1.2;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;max-width:72px;word-break:break-word}
.product-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:6px 16px 20px}@media(min-width:768px){.product-grid{grid-template-columns:repeat(4,1fr);max-width:1024px;margin:0 auto;gap:14px}}
.product-card{border-radius:var(--radius);overflow:hidden;border:1.5px solid var(--line);background:#fff;transition:all .2s;display:flex;flex-direction:column}
.product-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.07);border-color:var(--lilac)}
.product-card:hover .prod-img img{transform:scale(1.06)}
.prod-img{aspect-ratio:1;background:#f8f8f8;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.prod-img img{width:100%;height:100%;object-fit:cover;transition:transform .4s ease}
.prod-img-placeholder{font-size:2.5rem;opacity:.15;display:flex;align-items:center;justify-content:center;width:100%;height:100%}
.prod-info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.prod-title{font-size:.72rem;font-weight:700;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;color:var(--fg)}
.prod-price-row{display:flex;align-items:baseline;gap:6px;margin-top:auto}
.prod-price{font-size:.9rem;font-weight:800;color:var(--fg)}
.prod-compare{font-size:.65rem;color:var(--meta);text-decoration:line-through}
.pagination{display:flex;justify-content:center;align-items:center;gap:6px;padding:0 16px 20px;flex-wrap:wrap}
.pagination button{padding:8px 14px;border-radius:var(--pill);border:1.5px solid var(--line);background:#fff;font-size:.72rem;font-weight:600;color:var(--muted);cursor:pointer;transition:all .15s}
.pagination button:hover:not(:disabled){border-color:var(--meta)}
.pagination button.active{background:var(--fg);color:#fff;border-color:var(--fg)}
.pagination button:disabled{opacity:.35;cursor:not-allowed}
.pagination span{font-size:.72rem;color:var(--meta);padding:0 4px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:120;padding:6px 0 env(safe-area-inset-bottom,0)}
.bottom-nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px;font-size:.62rem;color:var(--muted);text-decoration:none;transition:color .15s}
.bottom-nav a.active,.bottom-nav a:hover{color:var(--fg)}.nav-icon{width:20px;height:20px}
.fade-in{animation:fadeIn .35s ease}@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.loading-text{text-align:center;padding:48px;color:var(--meta);grid-column:1/-1;font-size:.85rem}
</style><script src="js/currency.js?v=2"></script></head><body>
<div class="top-bar"><a class="back" href="javascript:history.back()">← Back</a><span id="cat-name">Loading...</span></div>
<div class="page-header"><h1 id="cat-title">Category</h1><p id="result-count"></p></div>
<div class="subcat-bar" id="subcat-bar"></div>
<div class="product-grid" id="product-grid"><div class="loading-text">Loading products...</div></div>
<div class="pagination" id="pagination"></div>
<nav class="bottom-nav">
<a href="/"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3" stroke="#777" stroke-width="2" fill="none"/></svg>Home</a>
<a href="products.html"><svg class="nav-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1" stroke="#777" stroke-width="1.5" fill="none"/></svg>Products</a>
<a href="categories.html" class="active"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" stroke="#777" stroke-width="2"/></svg>Categories</a>
<a href="wishlist.html"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z" stroke="#777" stroke-width="1.5" fill="none"/></svg>Wishlist</a>
<a href="cart.html" style="position:relative"><svg class="nav-icon" viewBox="0 0 24 24"><circle cx="9" cy="21" r="1" fill="#777"/><circle cx="20" cy="21" r="1" fill="#777"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6" stroke="#777" stroke-width="1.8" fill="none"/></svg><span id="nav-cart-count" style="position:absolute;top:-2px;right:-2px;background:var(--coral);color:#fff;font-size:.55rem;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px;font-weight:700">0</span></a>
<a href="profile.html"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" stroke="#777" stroke-width="2" fill="none"/></svg>Me</a>
</nav>


<script src="js/nav-icons.js"></script>
<script>
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function fmtPrice(p){return 'A$'+Number(p||0).toFixed(2)}

(function(){
  var params = new URLSearchParams(window.location.search);
  var slug = params.get('cat') || '';
  var name = params.get('name') || params.get('sub') || slug || 'Category';
  document.getElementById('cat-title').textContent = name;
  
  var grid = document.getElementById('product-grid');
  if(!grid) return;
  
  if(!slug){
    grid.innerHTML = '<div class="loading-text">No category specified</div>';
    return;
  }
  
  grid.innerHTML = '<div class="loading-text">Loading products...</div>';
  
  var x = new XMLHttpRequest();
  x.open('GET', '/data/' + encodeURIComponent(slug) + '.json', true);
  x.timeout = 15000;
  x.onload = function(){
    if(x.status < 200 || x.status >= 400){
      grid.innerHTML = '<div class="loading-text">Failed to load category</div>';
      return;
    }
    try {
      var prods = JSON.parse(x.responseText);
      if(!prods || !prods.length){
        grid.innerHTML = '<div class="loading-text">No products in this category</div>';
        document.getElementById('total-display').textContent = '0 products';
        return;
      }
      document.getElementById('total-display').textContent = prods.length + ' products';
      grid.innerHTML = '';
      prods.forEach(function(p, i){
        var a = document.createElement('a');
        a.className = 'product-card fade-in';
        a.href = 'product.html?id=' + p.id;
        a.style.animationDelay = (i * 0.03) + 's';
        var imgHtml = p.image
          ? '<img src="' + p.image + '" alt="" loading="lazy" onerror="this.parentElement.innerHTML=\'<div class=product-placeholder>📦</div>\'">'
          : '<div class="product-placeholder">📦</div>';
        a.innerHTML = imgHtml + '<div class="product-info"><div class="product-title">' + esc(p.title) + '</div><div class="product-price">' + fmtPrice(p.price) + '</div></div>';
        grid.appendChild(a);
      });
    } catch(e) {
      grid.innerHTML = '<div class="loading-text">Error loading products</div>';
    }
  };
  x.onerror = function(){
    grid.innerHTML = '<div class="loading-text">Failed to load category</div>';
  };
  x.send();
})();
</script>
<script>
(function(){try{var c=JSON.parse(localStorage.getItem("bd_cart")||"[]");var n=c.reduce(function(s,i){return s+(i.qty||1)},0);var b=document.getElementById("nav-cart-count");if(b){b.textContent=n;b.style.display=n>0?"":"none"}}catch(e){}})();
</script>

</body></html>
