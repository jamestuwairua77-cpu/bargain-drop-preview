<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>Category — Bargain Drop v10</title>
<style>:root{--bg:#fff;--fg:#111;--muted:#777;--line:#eee;--red:#e60023}*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg);padding-bottom:80px}a{color:inherit;text-decoration:none}img{display:block}.top-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#fff;position:sticky;top:0;z-index:109;border-bottom:1px solid var(--line)}.top-bar a{font-size:.75rem;font-weight:600;color:var(--muted)}.top-bar span{font-size:.65rem;font-weight:700}.page-header{padding:14px 14px 0}.page-header h1{font-size:1rem;font-weight:800}.page-header p{font-size:.7rem;color:var(--muted);margin-top:4px}.subcat-bar{display:flex;gap:6px;padding:10px 14px;overflow-x:auto;white-space:nowrap}.subcat-chip{padding:6px 14px;border-radius:20px;border:1.5px solid var(--line);background:#fff;font-size:.68rem;cursor:pointer;white-space:nowrap;transition:all .15s;font-weight:500}.subcat-chip:hover,.subcat-chip.active{background:var(--fg);color:#fff;border-color:var(--fg)}.product-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:12px 14px 16px}@media(min-width:768px){.product-grid{grid-template-columns:repeat(4,1fr);max-width:960px;margin:0 auto}}.product-card{border-radius:10px;overflow:hidden;border:1.5px solid var(--line);background:#fff;transition:all .15s}.product-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.08)}.prod-img{aspect-ratio:1;background:#f5f5f5;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.prod-img img{width:100%;height:100%;object-fit:cover}/* prod-badge removed */.prod-info{padding:6px 8px 8px}.prod-title{font-size:.7rem;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;margin-bottom:4px}.prod-price-row{display:flex;align-items:center;gap:4px}.prod-price{font-size:.85rem;font-weight:800;color:var(--red)}/* prod-compare removed */.pagination{display:flex;align-items:center;justify-content:center;gap:4px;padding:8px 14px 20px;flex-wrap:wrap}.pagination button{padding:6px 12px;border:1.5px solid var(--line);background:#fff;border-radius:8px;font-size:.72rem;cursor:pointer;color:var(--fg);min-width:36px}.pagination button:hover:not(:disabled){background:var(--fg);color:#fff;border-color:var(--fg)}.pagination button.active{background:var(--fg);color:#fff;border-color:var(--fg);font-weight:700}.pagination button:disabled{opacity:.4}.pagination span{padding:0 2px;color:var(--muted);font-size:.7rem}.loading-text{text-align:center;padding:40px;color:var(--muted);grid-column:1/-1}.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:120;padding:4px 0}.bottom-nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px;font-size:.6rem;color:var(--muted);text-decoration:none}.bottom-nav a.active,.bottom-nav a:hover{color:var(--fg)}.nav-icon{width:20px;height:20px}.fade-in{animation:fadeIn .3s ease}@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}</style>  
<script src="js/currency.js"></script>
</head>
<body><div class="top-bar"><a href="javascript:history.back()">← Back</a><span id="cat-name">Loading...</span></div><div class="page-header"><h1 id="cat-title">Category</h1><p id="result-count"></p></div><div class="subcat-bar" id="subcat-bar"></div><div class="product-grid" id="product-grid"><div class="loading-text">Loading products...</div></div><div class="pagination" id="pagination"></div><nav class="bottom-nav">

<script>function esc(t){return(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}var all=[],display=[],pageSize=50,current=1,cat='',sub='';var p=new URLSearchParams(location.search);cat=p.get('cat')||'';var catFiles={"Home, Garden & Furniture": "home-garden-furniture.json", "Jewelry & Watches": "jewelry-watches.json", "Health, Beauty & Hair": "health-beauty-hair.json", "Consumer Electronics": "consumer-electronics.json", "Automobiles & Motorcycles": "automobiles-motorcycles.json", "Home Improvement": "home-improvement.json", "Sports & Outdoors": "sports-outdoors.json", "Pet Supplies": "pet-supplies.json", "Women's Clothing": "womens-clothing.json", "Toys, Kids & Babies": "toys-kids-babies.json", "Bags & Shoes": "bags-shoes.json", "Phones & Accessories": "phones-accessories.json", "Men's Clothing": "mens-clothing.json", "Other": "other.json"};
BD.initCurrency().then(function(){(function load(){var fname=catFiles[cat];var url=fname?'https://raw.githubusercontent.com/jamestuwairua77-cpu/bargain-drop-preview/main/data/'+fname:'https://raw.githubusercontent.com/jamestuwairua77-cpu/bargain-drop-preview/main/categories-data.json';var x=new XMLHttpRequest();x.open('GET',url,true);x.timeout=20000;x.onload=function(){if(x.status>=200&&x.status<400){var d=JSON.parse(x.responseText);if(catFiles[cat]){all=d.products||[]}else{all=[];for(var k in d)all=all.concat(d[k].products||[])}display=all.slice();buildSubcats();filterSub('')}else{document.getElementById('product-grid').innerHTML='<div class="loading-text">Failed to load category</div>'}};x.onerror=function(){document.getElementById('product-grid').innerHTML='<div class="loading-text">Connection error. Please refresh.</div>'};x.send()})()});function buildSubcats(){var bar=document.getElementById('subcat-bar'),subs={};all.forEach(function(p){var s=p.subcategory||'All';subs[s]=(subs[s]||0)+1});var keys=Object.keys(subs).sort(function(a,b){return subs[b]-subs[a]});bar.innerHTML='';var ab=document.createElement('button');ab.className='subcat-chip active';ab.textContent='All';ab.onclick=function(){filterSub('')};bar.appendChild(ab);keys.forEach(function(k){var b=document.createElement('button');b.className='subcat-chip';b.textContent=esc(k);b.onclick=function(){filterSub(k)};bar.appendChild(b)});document.getElementById('cat-name').textContent=cat||'All Categories';document.getElementById('cat-title').textContent=cat||'All Categories'}function filterSub(s){sub=s;current=1;display=s?all.filter(function(p){return p.subcategory===s}):all.slice();renderPage(1);renderPagination()}function renderPage(pn){var g=document.getElementById('product-grid');g.innerHTML='';var start=(pn-1)*pageSize,slice=display.slice(start,start+pageSize);document.getElementById('result-count').textContent='';if(!slice.length){g.innerHTML='<div class="loading-text">No products found.</div>';return}slice.forEach(function(p){var a=document.createElement('a');a.className='product-card fade-in';a.href='product.html?id='+p.id;var disc=''; // discounts removeda.innerHTML='<div class="prod-img">'+disc+'<img src="'+esc(p.image||'')+'" onerror="this.style.display=\'none\'" alt=""></div><div class="prod-info"><div class="prod-title">'+esc(p.title)+'</div><div class="prod-price-row"><span class="prod-price">'+BD.formatMoneyCompact(p.price||0)+'</span>'+'')+'</div></div>';g.appendChild(a)});window.scrollTo({top:0,behavior:'smooth'})}function renderPagination(){var el=document.getElementById('pagination'),tp=Math.ceil(display.length/pageSize);if(tp<=1){el.innerHTML='';return}var h='';h+='<button onclick="goPage('+(current-1)+')" '+(current===1?'disabled':'')+'>Prev</button>';var s=Math.max(1,current-2),e=Math.min(tp,current+2);if(s>1){h+='<button onclick="goPage(1)">1</button>';if(s>2)h+='<span>...</span>'}for(var p=s;p<=e;p++)h+='<button class="'+(p===current?'active':'')+'" onclick="goPage('+p+')">'+p+'</button>';if(e<tp){if(e<tp-1)h+='<span>...</span>';h+='<button onclick="goPage('+tp+')">'+tp+'</button>'}h+='<button onclick="goPage('+(current+1)+')" '+(current===tp?'disabled':'')+'>Next</button>';el.innerHTML=h}function goPage(n){var tp=Math.ceil(display.length/pageSize);if(n<1||n>tp||n===current)return;current=n;renderPage(n);renderPagination()}</script>


<script>
(function(){try{var cart=JSON.parse(localStorage.getItem("bd_cart")||"[]");var n=cart.reduce(function(s,i){return s+(i.qty||1)},0);var b=document.getElementById("nav-cart-count");if(b){b.textContent=n;b.style.display=n>0?"":"none"}}catch(e){}})();
</script>
