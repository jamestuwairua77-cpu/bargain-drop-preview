<script>function esc(t){return(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}var all=[],display=[],pageSize=50,current=1,cat='',sub='';var p=new URLSearchParams(location.search);cat=p.get('cat')||'';var catFiles={"Home, Garden & Furniture": "home-garden-furniture.json", "Jewelry & Watches": "jewelry-watches.json", "Health, Beauty & Hair": "health-beauty-hair.json", "Consumer Electronics": "consumer-electronics.json", "Automobiles & Motorcycles": "automobiles-motorcycles.json", "Home Improvement": "home-improvement.json", "Sports & Outdoors": "sports-outdoors.json", "Pet Supplies": "pet-supplies.json", "Women's Clothing": "womens-clothing.json", "Toys, Kids & Babies": "toys-kids-babies.json", "Bags & Shoes": "bags-shoes.json", "Phones & Accessories": "phones-accessories.json", "Men's Clothing": "mens-clothing.json", "Other": "other.json"};
(function load(){var fname=catFiles[cat];var url=fname?'https://cdn.jsdelivr.net/gh/jamestuwairua77-cpu/bargain-drop-preview@main/data/'+fname:'https://cdn.jsdelivr.net/gh/jamestuwairua77-cpu/bargain-drop-preview@main/categories-data.json';var x=new XMLHttpRequest();x.open('GET',url,true);x.timeout=20000;x.onload=function(){if(x.status>=200&&x.status<400){var d=JSON.parse(x.responseText);if(catFiles[cat]){all=d.products||[]}else{all=[];for(var k in d)all=all.concat(d[k].products||[])}display=all.slice();buildSubcats();filterSub('')}else{document.getElementById('product-grid').innerHTML='<div class="loading-text">Failed to load category</div>'}};x.onerror=function(){document.getElementById('product-grid').innerHTML='<div class="loading-text">Connection error. Please refresh.</div>'};x.send()})();function buildSubcats(){var bar=document.getElementById('subcat-bar'),subs={};all.forEach(function(p){var s=p.subcategory||'All';subs[s]=(subs[s]||0)+1});var keys=Object.keys(subs).sort(function(a,b){return subs[b]-subs[a]});bar.innerHTML='';var ab=document.createElement('button');ab.className='subcat-chip active';ab.textContent='All';ab.onclick=function(){filterSub('')};bar.appendChild(ab);keys.forEach(function(k){var b=document.createElement('button');b.className='subcat-chip';b.textContent=esc(k);b.onclick=function(){filterSub(k)};bar.appendChild(b)});document.getElementById('cat-name').textContent=cat||'All Categories';document.getElementById('cat-title').textContent=cat||'All Categories'}function filterSub(s){sub=s;current=1;display=s?all.filter(function(p){return p.subcategory===s}):all.slice();renderPage(1);renderPagination()}function renderPage(pn){var g=document.getElementById('product-grid');g.innerHTML='';var start=(pn-1)*pageSize,slice=display.slice(start,start+pageSize);document.getElementById('result-count').textContent='';if(!slice.length){g.innerHTML='<div class="loading-text">No products found.</div>';return}slice.forEach(function(p){var a=document.createElement('a');a.className='product-card fade-in';a.href='product.html?id='+p.id;var ci=p.image||(p.images||[])[0]||'';var priceStr=typeof BD!=='undefined'?BD.formatMoneyCompact(p.price||0):&A$'+(p.price||0).toFixed(2);a.innerHTML='<div class="prod-img">'+(ci?'<img src="'+esc(ci)+'" loading="lazy" onerror="this.style.display=\'none\'" alt="">':'<span style="font-size:2.5rem;opacity:.2">📦</span>')+'</div><div class="prod-info"><div class="prod-title">'+esc(p.title)+'</div><div class="prod-price-row"><span class="prod-price">'+priceStr+'</span></div></div>';g.appendChild(a)});window.scrollTo({top:0,behavior:'smooth'})}function renderPagination(){var el=document.getElementById('pagination'),tp=Math.ceil(display.length/pageSize);if(tp<=1){el.innerHTML='';return}var h='';h+='<button onclick="goPage('+(current-1)+')" '+(current===1?'disabled':'')+'>Prev</button>';var s=Math.max(1,current-2),e=Math.min(tp,current+2);if(s>1){h+='<button onclick="goPage(1)">1</button>';if(s>2)h+='<span>...</span>'}for(var p=s;p<=e;p++)h+='<button class="'+(p===current?'active':'')+'" onclick="goPage('+p+')">'+p+'</button>'}if(e<tp){if(e<tp-1)h+='<span>...</span>';h+='<button onclick="goPage('+tp+')">'+tp+'</button>'}h+='<button onclick="goPage('+(current+1)+')" '+(current===tp?'disabled':'')+'>Next</button>';el.innerHTML=h}function goPage(n){var tp=Math.ceil(display.length/pageSize);if(n<1||n>tp||n===current)return;current=n;renderPage(n);renderPagination()}</script>
