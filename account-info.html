  <a href="profile.html" class="active"><svg class="nav-icon" viewBox="0 0 24 24" fill="none"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" stroke="#111" stroke-width="2"/><circle cx="12" cy="7" r="4" stroke="#111" stroke-width="2"/></svg>Me</a>
</nav>
<script src="js/account.js"></script>

<script>
(function(){
  var pic = localStorage.getItem('bd_user_pic');
  if (!pic) return;
  var links = document.querySelectorAll('a[href="profile.html"]');
  links.forEach(function(a){
    var svg = a.querySelector('svg');
    if (!svg || a.querySelector('img[src]') || svg.querySelector('img')) return;
    var svgText = svg.outerHTML || svg.innerHTML || '';
    if (svgText.indexOf('M20 21v-2') === -1) return;
    svg.style.display = 'none';
    var img = document.createElement('img');
    img.src = pic;
    img.alt = 'Profile';
    img.style.cssText = 'width:22px;height:22px;border-radius:50%;object-fit:cover';
    img.onerror = function(){ svg.style.display=''; img.remove(); };
    a.insertBefore(img, svg);
  });
})();
</script>
</body>
</html>
