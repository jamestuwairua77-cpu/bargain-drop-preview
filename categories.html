<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"><title>Categories — Bargain Drop</title>
<link rel="canonical" href="https://bargain-drop.online/categories.html">
<meta name="description" content="Browse all product categories at Bargain Drop — find great deals across every department.">
<style>:root{--bg:#fafaf8;--fg:#1A1A1A;--muted:#6B6B6B;--meta:#9B9B9B;--line:#F0F0F0;--lilac:#B8A9E8;--amber:#F5A623;--teal:#4ECDC4;--coral:#FF6B6B;--green:#4ADE80;--radius:16px;--pill:9999px}*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg);padding-bottom:88px;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}img{display:block;max-width:100%}
.header{display:flex;align-items:center;padding:14px 16px;background:#fff;position:sticky;top:0;z-index:109;border-bottom:1px solid var(--line);gap:14px}
.header a.back{font-size:.82rem;font-weight:700;color:var(--fg);display:flex;align-items:center;gap:4px}
.header span.title{font-size:.82rem;font-weight:700;color:var(--muted)}
.cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:14px 16px 20px}@media(min-width:768px){.cat-grid{grid-template-columns:repeat(4,1fr);max-width:1024px;margin:0 auto;gap:14px}}
.cat-card{display:flex;flex-direction:column;overflow:hidden;border-radius:var(--radius);border:1.5px solid var(--line);cursor:pointer;background:#fff;transition:all .2s;text-decoration:none;color:inherit}
.cat-card:hover{transform:translateY(-3px);box-shadow:0 6px 20px rgba(0,0,0,.06);border-color:var(--lilac)}
.cat-hero{width:100%;aspect-ratio:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:1px;background:var(--line);overflow:hidden}
.cat-hero img{width:100%;height:100%;object-fit:cover}.cat-hero img:first-child{grid-row:1/3}
.cat-hero-placeholder{grid-row:1/3;display:flex;align-items:center;justify-content:center;font-size:2rem;background:#f5f5f5;width:100%;height:100%}
.cat-hero-fill{background:#f5f5f5}
.cat-card-info{padding:10px 12px 12px;text-align:center}
.cat-card-info .cc-label{font-size:.72rem;font-weight:700;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word;color:var(--fg)}
.cat-card-info .cc-count{font-size:.6rem;color:var(--meta);margin-top:3px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:120;padding:6px 0 env(safe-area-inset-bottom,0)}
.bottom-nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px;font-size:.62rem;color:var(--muted);text-decoration:none;transition:color .15s}
.bottom-nav a.active,.bottom-nav a:hover{color:var(--fg)}.nav-icon{width:20px;height:20px}
.fade-in{animation:fadeIn .35s ease}@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.loading-text{text-align:center;padding:48px;color:var(--meta);grid-column:1/-1;font-size:.85rem}
</style></head><body>
<div class="header"><a class="back" href="/">← Home</a><span class="title"><h1>All Categories</h1></span></div>
<div class="cat-grid" id="cat-grid"><div class="loading-text">Loading...</div></div>
<nav class="bottom-nav">
<a href="/"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3" stroke="#777" stroke-width="2" fill="none"/></svg>Home</a>
<a href="products.html"><svg class="nav-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1" stroke="#777" stroke-width="1.5" fill="none"/></svg>Products</a>
<a href="categories.html" class="active"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" stroke="#777" stroke-width="2"/></svg>Categories</a>
<a href="wishlist.html"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z" stroke="#777" stroke-width="1.5" fill="none"/></svg>Wishlist</a>
<a href="cart.html" style="position:relative"><svg class="nav-icon" viewBox="0 0 24 24"><circle cx="9" cy="21" r="1" fill="#777"/><circle cx="20" cy="21" r="1" fill="#777"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6" stroke="#777" stroke-width="1.8" fill="none"/></svg><span id="nav-cart-count" style="position:absolute;top:-2px;right:-2px;background:var(--coral);color:#fff;font-size:.55rem;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px;font-weight:700">0</span></a>
<a href="profile.html"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" stroke="#777" stroke-width="2" fill="none"/></svg>Me</a>
</nav>
<script>
var C={"Women's Clothing":"[dress]","Home, Garden & Furniture":"[home]","Jewelry & Watches":"[ring]","Automobiles & Motorcycles":"[car]","Health, Beauty & Hair":"[makeup]","Men's Clothing":"[shirt]","Bags & Shoes":"[bag]","Pet Supplies":"[paw]","Toys, Kids & Babies":"[toy]","Home Improvement":"[wrench]","Sports & Outdoors":"[ball]","Phones & Accessories":"[phone]","Consumer Electronics":"[headphones]","Other":"[box]"};
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
(function(){
  var g=document.getElementById('cat-grid');
  var x=new XMLHttpRequest();
  // Load from same domain — now includes hero_images
  x.open('GET','/categories-index.json',true);
  x.timeout=12000;
  x.onload=function(){
    try{
      if(x.status>=200&&x.status<400){
        var d=JSON.parse(x.responseText);
        var cs=Object.keys(d);
        g.innerHTML='';
        cs.sort(function(a,b){return (d[b].product_count||0)-(d[a].product_count||0)}).forEach(function(c){
          var info=d[c]||{},heroes=info.hero_images||[],count=info.product_count||0,emoji=C[c]||'[box]';
          var a=document.createElement('a');a.className='cat-card fade-in';a.href='category.html?cat='+encodeURIComponent(c);
          if(heroes.length>0){
            var ih='<div class="cat-hero">';
            for(var h=0;h<4&&h<heroes.length;h++){
              ih+='<img src="'+heroes[h]+'" alt="" loading="lazy" onerror="this.style.display=\'none\'" '+(h===0?' style="grid-row:1/3"':'')+'>';
            }
            ih+='</div>';
            a.innerHTML=ih+'<div class="cat-card-info"><div class="cc-label">'+esc(c)+'</div><div class="cc-count">'+count.toLocaleString()+' products</div></div>';
          }else{
            a.innerHTML='<div class="cat-hero"><div class="cat-hero-placeholder">'+emoji+'</div><div class="cat-hero-fill"></div><div class="cat-hero-fill"></div><div class="cat-hero-fill"></div></div><div class="cat-card-info"><div class="cc-label">'+esc(c)+'</div><div class="cc-count">'+count.toLocaleString()+' products</div></div>';
          }
          g.appendChild(a);
        });
      }else{g.innerHTML='<div class="loading-text">Failed to load categories</div>'}
    }catch(e){g.innerHTML='<div class="loading-text">Error: '+esc(e.message)+'</div>'}
  };
  x.onerror=function(){g.innerHTML='<div class="loading-text">Network error. Please refresh.</div>'};
  x.ontimeout=function(){g.innerHTML='<div class="loading-text">Request timed out. Please refresh.</div>'};
  x.send();
})();
</script>
<script>(function(){try{var cart=JSON.parse(localStorage.getItem("bd_cart")||"[]");var n=cart.reduce(function(s,i){return s+(i.qty||1)},0);var b=document.getElementById("nav-cart-count");if(b){b.textContent=n;b.style.display=n>0?"":"none"}}catch(e){}})();</script>
<script src="js/nav-icons.js"></script>
</body></html>
