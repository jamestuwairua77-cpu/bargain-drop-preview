<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Product — Bargain Drop v10</title>
<link rel="stylesheet" href="css/product.css">
</head>
<body>
<div class="top-bar"><a href="javascript:history.back()">← Back</a></div>

<div id="not-found" style="display:none">
  <div style="text-align:center;padding:40px">
    <h2>Product not found</h2>
    <p>The product you are looking for does not exist or has been removed.</p>
    <a href="/" class="btn">Go Home</a>
  </div>
</div>

<div id="product-detail">
  <div class="image-stack" id="image-stack">
    <div class="main-image" id="main-image"></div>
    <div class="thumbs" id="thumbs"></div>
  </div>
  <div class="product-info">
    <h1 id="prod-title">Loading...</h1>
    <div class="price-row">
      <span class="price" id="prod-price"></span>
      <span class="old-price" id="prod-old-price"></span>
      <span class="discount-badge" id="prod-discount"></span>
    </div>
    <div id="prod-variants"></div>
    <div class="qty-row">
      <button class="qty-btn" onclick="changeQty(-1)">−</button>
      <span id="qty-val">1</span>
      <button class="qty-btn" onclick="changeQty(1)">℡</button>
    </div>
    <button class="add-to-cart" id="add-to-cart">Add to Cart</button>
    <button class="buy-now" id="buy-now">Buy Now</button>
    <p id="prod-desc">Loading description...</p>
  </div>
</div>

<nav class="bottom-nav">
<a href="/"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3" stroke="#777" stroke-width="2" fill="none"/></svg>Home</a>
<a href="products.html"><svg class="nav-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1" stroke="#777" stroke-width="1.5" fill="none"/></svg>Products</a>
<a href="categories.html"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" stroke="#777" stroke-width="2"/></svg>Categories</a>
<a href="wishlist.html"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z" stroke="#777" stroke-width="1.5" fill="none"/></svg>Wishlist</a>
<a href="cart.html" style="position:relative"><svg class="nav-icon" viewBox="0 0 24 24"><circle cx="9" cy="21" r="1" fill="#777"/><circle cx="20" cy="21" r="1" fill="#777"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6" stroke="#777" stroke-width="1.8" fill="none"/></svg><span id="nav-cart-count" style="position:absolute;top:-2px;right:-2px;background:#e60023;color:#fff;font-size:.55rem;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px;font-weight:700">0</span></a>
<a href="profile.html"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" stroke="#777" stroke-width="2" fill="none"/></svg>Me</a>
</nav>

<script src="js/currency.js?v=2"></script>
<script src="js/product.js"></script>

<script>(function(){var b=document.getElementById("nav-cart-count");if(b){try{var cart=JSON.parse(localStorage.getItem("bd_cart")||"[]");var n=cart.reduce(function(s,i){return s+(i.qty||1)},0);b.textContent=n;b.style.display=n>0?"":"none"}catch(e){}}})();</script>
<script src="js/nav-icons.js"></script>
</body></html>
