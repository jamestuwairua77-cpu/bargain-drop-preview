<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>Bargain Drop — Preview v10</title>
<style>:root{--bg:#fff;--fg:#111;--muted:#777;--line:#eee;--red:#e60023}*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg);padding-bottom:80px}a{color:inherit;text-decoration:none}img{display:block}.top-bar{display:flex;align-items:center;justify-content:center;overflow:hidden;background:linear-gradient(90deg,#ff6b6b,#feca57,#ff9ff3,#54a0ff,#5f27cd);padding:6px 0;position:sticky;top:0;z-index:110}.top-bar-inner{white-space:nowrap;font-size:.68rem;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.3);letter-spacing:1px;animation:scrollText 8s linear infinite}@keyframes scrollText{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}.header{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:#fff;position:sticky;top:0;z-index:109;border-bottom:1px solid var(--line)}.logo{display:flex;align-items:center;gap:6px}.logo-text{font-size:1.15rem;font-weight:900}.logo-text .bd-b{background:linear-gradient(135deg,#e60023,#ff4757);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}.logo-text .bd-d{color:#111}.logo-icon{width:24px;height:24px;border-radius:6px;background:linear-gradient(135deg,#e60023,#ff6b81);display:flex;align-items:center;justify-content:center;color:#fff;font-size:.65rem;font-weight:900}.header-actions{display:flex;align-items:center;gap:14px}.header-actions a,.header-actions button{background:none;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:2px;color:inherit;text-decoration:none}.cart-btn{position:relative}.cart-count{position:absolute;top:-5px;right:-8px;background:var(--red);color:#fff;font-size:.55rem;min-width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;padding:0 3px}.search-wrap{padding:8px 14px;background:#fff}.search-box{display:flex;align-items:center;background:#f5f5f5;border-radius:20px;padding:8px 14px;gap:8px;border:1.5px solid transparent;transition:all .2s}.search-box:focus-within{border-color:#111;background:#fff}.search-box input{border:none;background:none;outline:none;flex:1;font-size:.78rem}.search-clear{background:none;border:none;cursor:pointer;padding:0;display:none;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:#ddd;color:#555;font-size:.65rem;font-weight:700;line-height:1}.section-title{font-size:.85rem;font-weight:800;padding:16px 14px 8px;display:flex;justify-content:space-between;align-items:center}.section-title a{font-size:.7rem;font-weight:500;color:var(--muted)}.search-count{font-size:.65rem;font-weight:500;color:var(--muted)}.cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:0 14px 16px}@media(min-width:768px){.cat-grid{grid-template-columns:repeat(4,1fr);max-width:960px;margin:0 auto}}.cat-card{display:flex;flex-direction:column;overflow:hidden;border-radius:12px;border:1.5px solid var(--line);cursor:pointer;background:#fff;transition:all .15s}.cat-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.08)}.cat-hero{width:100%;aspect-ratio:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px;background:#f0f0f0;overflow:hidden}.cat-hero img{width:100%;height:100%;object-fit:cover}.cat-hero img:first-child{grid-row:1/3}.cat-card-info{padding:8px 10px 10px;text-align:center}.cat-card-info .cc-label{font-size:.7rem;font-weight:700;line-height:1.2}.cat-card-info .cc-count{font-size:.6rem;color:var(--muted);margin-top:2px}.product-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:0 14px 16px}@media(min-width:768px){.product-grid{grid-template-columns:repeat(4,1fr);max-width:960px;margin:0 auto}}.product-card{border-radius:10px;overflow:hidden;border:1.5px solid var(--line);background:#fff;transition:all .15s}.product-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.08)}.prod-img{aspect-ratio:1;background:#f5f5f5;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.prod-img img{width:100%;height:100%;object-fit:cover}.prod-badge{position:absolute;top:4px;left:4px;background:var(--red);color:#fff;font-size:.55rem;font-weight:700;padding:2px 5px;border-radius:4px}.prod-info{padding:6px 8px 8px}.prod-titleLASDFASDF}</style></head>
